<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหลายร้านค้า</title>
    <!-- Supabase JS (UMD build) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 400px; margin: 30px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 18px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-link { background: none; color: #0070f3; border: none; padding: 0; text-decoration: underline; cursor: pointer; font-weight: normal; margin-top: 10px; }
        .muted { color: #666; font-size: 13px; }
    </style>
</head>
<body>

    <!-- 1. หน้าจอหลักในการล็อกอินด้วย PIN -->
    <div id="login-screen" class="card">
        <h2>🔒 เข้าสู่ระบบร้านค้า</h2>
        <label>เลือกบัญชีผู้ใช้:</label>
        <select id="login-user-select"></select>

        <label>กรอกรหัส PIN (ตัวเลข):</label>
        <input type="password" id="login-pin" pattern="[0-9]*" inputmode="numeric" placeholder="รหัส PIN 4-6 หลัก">
        
        <button onclick="checkLogin()">ปลดล็อกระบบ</button>
        <p class="muted">หมายเหตุ: คีย์ Supabase จะถูกเก็บแบบเข้ารหัสในเครื่อง (AES‑GCM) ด้วย PIN ของคุณ</p>
        <center><button class="btn-link" onclick="showRegister()">➕ ลงทะเบียนผู้ใช้ใหม่ / เพิ่มร้านค้า</button></center>
    </div>

    <!-- 2. หน้าจอลงทะเบียนผู้ใช้ใหม่ (กรอกครั้งแรก) -->
    <div id="register-screen" class="card hidden">
        <h2>✨ ลงทะเบียนบัญชีใหม่</h2>
        <label>ชื่อผู้ใช้ / ชื่อร้านค้า:</label>
        <input type="text" id="reg-username" placeholder="เช่น ร้านสาขาประตูนํ้า">
        
        <label>กำหนดรหัส PIN เข้าใช้เครื่องนี้:</label>
        <input type="password" id="reg-pin" pattern="[0-9]*" inputmode="numeric" placeholder="ตัวเลข 4-6 หลัก">

        <label>Supabase URL ของคุณ:</label>
        <input type="text" id="reg-url" placeholder="https://your-project.supabase.co">
        
        <label>Supabase Anon Key ของคุณ:</label>
        <input type="text" id="reg-key" placeholder="eyJhbGciOiJIUzI1Ni...">

        <button onclick="saveNewAccount()">บันทึกและสร้างบัญชี</button>
        <center><button class="btn-link" onclick="showLogin()">ย้อนกลับไปหน้าล็อกอิน</button></center>
    </div>

    <!-- 3. หน้าจอหลักของแอปขายของเมื่อซิงค์สำเร็จ -->
    <div id="main-app" class="card hidden">
        <h2 id="app-title">🏪 ร้านค้าของคุณ</h2>
        <div id="product-list">กำลังโหลดสินค้าจาก Supabase ของคุณ...</div>
        <br>
        <button style="background:#ff4444;" onclick="logout()">ออกจากระบบ</button>
    </div>

    <script>
        // --- Utilities: base64 & buffer helpers ---
        const toBase64 = (buffer) => {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
        };
        const fromBase64 = (b64) => {
            const binary = atob(b64);
            const len = binary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        };

        // --- Web Crypto helpers ---
        async function generateSalt() {
            const s = crypto.getRandomValues(new Uint8Array(16));
            return toBase64(s);
        }
        function generateIV() {
            return toBase64(crypto.getRandomValues(new Uint8Array(12)));
        }

        async function deriveKeyFromPin(pin, saltB64, iterations = 150000) {
            const salt = new Uint8Array(fromBase64(saltB64));
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                enc.encode(pin),
                { name: 'PBKDF2' },
                false,
                ['deriveKey', 'deriveBits']
            );

            // derive AES-GCM key
            const key = await crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: iterations,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                true, // extractable so we can export for a PIN-hash
                ['encrypt', 'decrypt']
            );
            return { key, iterations };
        }

        async function exportKeyHash(key) {
            // export raw bytes of the derived AES key as a PIN-verifier
            const raw = await crypto.subtle.exportKey('raw', key);
            return toBase64(raw);
        }

        async function encryptText(plainText, cryptoKey, ivB64) {
            const iv = new Uint8Array(fromBase64(ivB64));
            const enc = new TextEncoder();
            const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, enc.encode(plainText));
            return toBase64(ct);
        }

        async function decryptText(cipherB64, cryptoKey, ivB64) {
            const iv = new Uint8Array(fromBase64(ivB64));
            const ct = fromBase64(cipherB64);
            const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, ct);
            const dec = new TextDecoder();
            return dec.decode(plainBuf);
        }

        // --- Local storage account helpers (encrypted storage schema) ---
        function getAccounts() {
            const data = localStorage.getItem('local_accounts');
            return data ? JSON.parse(data) : [];
        }
        function saveAccounts(accounts) {
            localStorage.setItem('local_accounts', JSON.stringify(accounts));
        }

        // --- UI navigation ---
        function showLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('register-screen').classList.add('hidden');
            document.getElementById('main-app').classList.add('hidden');

            const accounts = getAccounts();
            const select = document.getElementById('login-user-select');
            select.innerHTML = '';

            if (accounts.length === 0) { showRegister(); return; }

            accounts.forEach(acc => {
                const opt = document.createElement('option');
                opt.value = acc.username;
                opt.textContent = acc.username;
                select.appendChild(opt);
            });
            document.getElementById('login-pin').value = '';
        }
        function showRegister() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('register-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
        }

        // --- Registration: encrypt Supabase key with PIN-derived key, store salt/iv/ciphertext and pin verifier ---
        async function saveNewAccount() {
            const username = document.getElementById('reg-username').value.trim();
            const pin = document.getElementById('reg-pin').value.trim();
            const url = document.getElementById('reg-url').value.trim();
            const key = document.getElementById('reg-key').value.trim();

            if (!username || !pin || !url || !key) return alert('กรุณากรอกข้อมูลให้ครบทุกช่อง');
            if (!/^[0-9]{4,}$/.test(pin)) return alert('รหัส PIN ต้องเป็นตัวเลขอย่างน้อย 4 หลัก');

            const accounts = getAccounts();
            if (accounts.some(acc => acc.username.toLowerCase() === username.toLowerCase())) {
                return alert('ชื่อผู้ใช้หรือชื่อร้านค้านี้มีอยู่ในเครื่องแล้ว');
            }

            try {
                const salt = await generateSalt();
                const iv = generateIV();
                const { key: derivedKey, iterations } = await deriveKeyFromPin(pin, salt);
                const pinVerifier = await exportKeyHash(derivedKey); // store as verifier instead of raw PIN
                const cipher = await encryptText(key, derivedKey, iv);

                accounts.push({ username, sb_url: url, sb_key_enc: cipher, sb_key_iv: iv, sb_key_salt: salt, pin_verifier: pinVerifier, kdf_iterations: iterations });
                saveAccounts(accounts);

                alert('สร้างบัญชีและบันทึกคีย์แบบเข้ารหัสสำเร็จ!');
                document.getElementById('reg-username').value = '';
                document.getElementById('reg-pin').value = '';
                document.getElementById('reg-url').value = '';
                document.getElementById('reg-key').value = '';
                showLogin();
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดระหว่างการสร้างบัญชี');
            }
        }

        // --- Login: derive key from PIN and decrypt stored sb_key; verify pin by comparing derived key export ---
        async function checkLogin() {
            const selectedUser = document.getElementById('login-user-select').value;
            const inputPin = document.getElementById('login-pin').value;
            const accounts = getAccounts();
            const currentAccount = accounts.find(acc => acc.username === selectedUser);

            if (!currentAccount) return alert('ไม่พบบัญชีที่เลือก');
            if (!inputPin) return alert('กรุณากรอก PIN');

            try {
                const { key: derivedKey } = await deriveKeyFromPin(inputPin, currentAccount.sb_key_salt, currentAccount.kdf_iterations || 150000);
                const derivedVerifier = await exportKeyHash(derivedKey);
                if (derivedVerifier !== currentAccount.pin_verifier) {
                    return alert('รหัส PIN ไม่ถูกต้อง ลองใหม่อีกครั้ง');
                }

                // PIN OK — decrypt key
                const sbKey = await decryptText(currentAccount.sb_key_enc, derivedKey, currentAccount.sb_key_iv);

                // proceed to main app
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('app-title').textContent = `🏪 ร้าน: ${currentAccount.username}`;

                // connect to supabase and fetch products
                connectToSupabase(currentAccount.sb_url, sbKey);
            } catch (err) {
                console.error(err);
                alert('ไม่สามารถถอดรหัสคีย์ได้ — อาจเกิดจาก PIN ผิดหรือข้อมูลในเครื่องเสียหาย');
            }
        }

        // --- Supabase connection (unchanged behavior) ---
        async function connectToSupabase(url, key) {
            document.getElementById('product-list').innerHTML = '🔄 กำลังดึงข้อมูลสินค้าของคุณ...';
            try {
                const supabaseClient = window.supabase.createClient(url, key);
                const { data, error } = await supabaseClient.from('products').select('*');

                if (error) throw error;

                if(!data || data.length === 0) {
                    document.getElementById('product-list').innerHTML = 'ℹ️ ไม่พบรายการสินค้าในตารางของคุณ';
                    return;
                }

                let html = '<h3>📦 รายการสินค้าที่ซิงค์สำเร็จ:</h3><ul>';
                data.forEach(p => { html += `<li><strong>${p.name}</strong> - ราคา ${p.price} บาท</li>`; });
                html += '</ul>';
                document.getElementById('product-list').innerHTML = html;

            } catch (err) {
                document.getElementById('product-list').innerHTML = `❌ เชื่อมต่อผิดพลาด: ตรวจสอบความถูกต้องของคีย์หรือตารางบน Supabase ของคุณ`;
                console.error(err);
            }
        }

        function logout() { showLogin(); }

        // init
        showLogin();
    </script>
</body>
</html>
