<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหลายร้านค้า</title>
    <!-- Supabase JS (UMD build) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 400px; margin: 30px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 18px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-link { background: none; color: #0070f3; border: none; padding: 0; text-decoration: underline; cursor: pointer; font-weight: normal; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- 1. หน้าจอหลักในการล็อกอินด้วย PIN -->
    <div id="login-screen" class="card">
        <h2>🔒 เข้าสู่ระบบร้านค้า</h2>
        <label>เลือกบัญชีผู้ใช้:</label>
        <select id="login-user-select"></select>

        <label>กรอกรหัส PIN (ตัวเลข):</label>
        <input type="password" id="login-pin" pattern="[0-9]*" inputmode="numeric" placeholder="รหัส PIN 4-6 หลัก">
        
        <button onclick="checkLogin()">ปลดล็อกระบบ</button>
        <center><button class="btn-link" onclick="showRegister()">➕ ลงทะเบียนผู้ใช้ใหม่ / เพิ่มร้านค้า</button></center>
    </div>

    <!-- 2. หน้าจอลงทะเบียนผู้ใช้ใหม่ (กรอกครั้งแรก) -->
    <div id="register-screen" class="card hidden">
        <h2>✨ ลงทะเบียนบัญชีใหม่</h2>
        <label>ชื่อผู้ใช้ / ชื่อร้านค้า:</label>
        <input type="text" id="reg-username" placeholder="เช่น ร้านสาขาประตูนํ้า">
        
        <label>กำหนดรหัส PIN เข้าใช้เครื่องนี้:</label>
        <input type="password" id="reg-pin" pattern="[0-9]*" inputmode="numeric" placeholder="ตัวเลข 4-6 หลัก">

        <label>Supabase URL ของคุณ:</label>
        <input type="text" id="reg-url" placeholder="https://your-project.supabase.co">
        
        <label>Supabase Anon Key ของคุณ:</label>
        <input type="text" id="reg-key" placeholder="eyJhbGciOiJIUzI1Ni...">

        <button onclick="saveNewAccount()">บันทึกและสร้างบัญชี</button>
        <center><button class="btn-link" onclick="showLogin()">ย้อนกลับไปหน้าล็อกอิน</button></center>
    </div>

    <!-- 3. หน้าจอหลักของแอปขายของเมื่อซิงค์สำเร็จ -->
    <div id="main-app" class="card hidden">
        <h2 id="app-title">🏪 ร้านค้าของคุณ</h2>
        <div id="product-list">กำลังโหลดสินค้าจาก Supabase ของคุณ...</div>
        <br>
        <button style="background:#ff4444;" onclick="logout()">ออกจากระบบ</button>
    </div>

    <script>
        // ดึงรายชื่อบัญชีทั้งหมดจากเครื่อง หากไม่มีให้เริ่มจากอาเรย์ว่าง
        function getAccounts() {
            const data = localStorage.getItem('local_accounts');
            return data ? JSON.parse(data) : [];
        }

        // ฟังก์ชันจัดการหน้าจอ ล็อกอิน
        function showLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('register-screen').classList.add('hidden');
            document.getElementById('main-app').classList.add('hidden');
            
            // อัปเดตรายชื่อในเมนู Dropdown
            const accounts = getAccounts();
            const select = document.getElementById('login-user-select');
            select.innerHTML = '';

            if (accounts.length === 0) {
                // ถ้าไม่มีบัญชีเลยในเครื่อง ให้ข้ามไปหน้าสมัครสมาชิกทันที
                showRegister();
                return;
            }

            accounts.forEach(acc => {
                const opt = document.createElement('option');
                opt.value = acc.username;
                opt.textContent = acc.username;
                select.appendChild(opt);
            });
            document.getElementById('login-pin').value = '';
        }

        // ฟังก์ชันจัดการหน้าจอ ลงทะเบียน
        function showRegister() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('register-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
        }

        // ฟังก์ชันบันทึกบัญชีใหม่ลง LocalStorage
        function saveNewAccount() {
            const username = document.getElementById('reg-username').value.trim();
            const pin = document.getElementById('reg-pin').value.trim();
            const url = document.getElementById('reg-url').value.trim();
            const key = document.getElementById('reg-key').value.trim();

            if (!username || !pin || !url || !key) return alert('กรุณากรอกข้อมูลให้ครบทุกช่อง');
            if (isNaN(pin)) return alert('รหัส PIN ต้องเป็นตัวเลขเท่านั้น');

            const accounts = getAccounts();
            
            // ตรวจสอบชื่อซํ้า
            if (accounts.some(acc => acc.username.toLowerCase() === username.toLowerCase())) {
                return alert('ชื่อผู้ใช้หรือชื่อร้านค้านี้มีอยู่ในเครื่องแล้ว');
            }

            // เพิ่มบัญชีใหม่เข้าไปในรายชื่อ
            accounts.push({ username, pin, sb_url: url, sb_key: key });
            localStorage.setItem('local_accounts', JSON.stringify(accounts));
            
            alert('สร้างบัญชีและบันทึกคีย์สำเร็จ!');
            // รีเซ็ตล้างค่าในฟอร์มสมัคร
            document.getElementById('reg-username').value = '';
            document.getElementById('reg-pin').value = '';
            document.getElementById('reg-url').value = '';
            document.getElementById('reg-key').value = '';
            
            showLogin();
        }

        // ฟังก์ชันตรวจสอบ PIN เพื่อเข้าใช้งาน
        function checkLogin() {
            const selectedUser = document.getElementById('login-user-select').value;
            const inputPin = document.getElementById('login-pin').value;
            
            const accounts = getAccounts();
            // ค้นหาบัญชีที่เลือก
            const currentAccount = accounts.find(acc => acc.username === selectedUser);

            if (currentAccount && currentAccount.pin === inputPin) {
                // รหัสผ่านถูกต้อง เข้าสู่หน้าจอหลัก
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('app-title').textContent = `🏪 ร้าน: ${currentAccount.username}`;
                
                // เริ่มทำการเชื่อมต่อข้อมูลไปยัง Supabase ของบุคคลนั้น
                connectToSupabase(currentAccount.sb_url, currentAccount.sb_key);
            } else {
                alert('รหัส PIN ไม่ถูกต้อง ลองใหม่อีกครั้ง');
            }
        }

        // ฟังก์ชันเชื่อมต่อไปยัง Supabase ส่วนบุคคล
        async function connectToSupabase(url, key) {
            document.getElementById('product-list').innerHTML = '🔄 กำลังดึงข้อมูลสินค้าของคุณ...';
            try {
                // ใช้ UMD global ที่มาในสคริปต์ supabase.min.js
                const supabaseClient = window.supabase.createClient(url, key);
                const { data, error } = await supabaseClient.from('products').select('*');

                if (error) throw error;

                if(!data || data.length === 0) {
                    document.getElementById('product-list').innerHTML = 'ℹ️ ไม่พบรายการสินค้าในตารางของคุณ';
                    return;
                }

                let html = '<h3>📦 รายการสินค้าที่ซิงค์สำเร็จ:</h3><ul>';
                data.forEach(p => { html += `<li><strong>${p.name}</strong> - ราคา ${p.price} บาท</li>`; });
                html += '</ul>';
                document.getElementById('product-list').innerHTML = html;

            } catch (err) {
                document.getElementById('product-list').innerHTML = `❌ เชื่อมต่อผิดพลาด: ตรวจสอบความถูกต้องของคีย์หรือตารางบน Supabase ของคุณ`;
                console.error(err);
            }
        }

        function logout() {
            showLogin();
        }

        // สั่งให้เช็กระบบทันทีเมื่อเข้าหน้าเว็บครั้งแรก
        showLogin();
    </script>
</body>
</html>
